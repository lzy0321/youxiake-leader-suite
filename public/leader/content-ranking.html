<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f9" />
    <title>内容榜 - 游侠领队</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./content-ranking.css" />
  </head>
  <body>
    <main class="phone-shell ranking-shell">
      <header class="app-header ranking-header">
        <button id="backButton" class="icon-button" aria-label="返回">←</button>
        <button class="icon-button close-button" aria-label="关闭">×</button>
        <h1>内容榜 - 游侠领队</h1>
      </header>

      <section class="ranking-hero">
        <div class="ranking-brand">
          <span>实时更新</span>
          <strong>领队内容榜</strong>
          <small>用好内容记录每一次出发</small>
        </div>

        <div class="ranking-period" role="tablist" aria-label="排行时间">
          <button class="time-tab active" data-time="year" role="tab" aria-selected="true">年度排行</button>
          <button class="time-tab" data-time="month" role="tab" aria-selected="false">本月排行</button>
          <button class="time-tab" data-time="lastMonth" role="tab" aria-selected="false">上月排行</button>
        </div>

        <div class="ranking-options" aria-label="内容榜类型">
          <label>
            <small>榜单类型</small>
            <select id="typeSelect">
              <option value="meet">遇见排行</option>
              <option value="travel">游记排行</option>
              <option value="xhs">小红书排行</option>
              <option value="douyin">抖音排行</option>
            </select>
          </label>
        </div>

        <p class="ranking-note">榜单按有效内容数量与内容质量综合计算，每日更新</p>

        <div id="podium" class="podium"></div>
      </section>

      <section class="ranking-list-wrap">
        <div class="list-heading"><span>排名</span><span>领队</span><span id="metricLabel">有效内容</span></div>
        <div id="rankingList" class="ranking-list"></div>
      </section>

      <aside class="my-ranking">
        <strong id="myRank">96</strong>
        <span class="rank-avatar">易</span>
        <span><b>易涟</b><small>杭州站 · 我的</small></span>
        <em id="myScore">12篇</em>
      </aside>
    </main>
    <script src="./content-ranking.js"></script>
  </body>
</html>
