<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f6" />
    <title>提交游记/遇见 - 游侠领队</title>
    <link rel="stylesheet" href="./submit-content.css" />
  </head>
  <body>
    <main class="submit-shell">
      <header class="submit-header">
        <button id="submitBack" class="back-button" aria-label="返回">‹</button>
        <h1>提交游记/遇见</h1>
        <span class="mini-actions">•••　◉</span>
      </header>

      <button class="guide-bar" data-toast="打开新手指南与常见问题">
        <span>♧　新手指南及常见问题解答</span><b>点击查看　›</b>
      </button>

      <section class="trip-overview">
        <h2><span>会员</span>古道传奇 3–4月，重返徽商之路多后就好看但是撒大声地所所多付多所但是是放公司…</h2>
        <p>2021-05-12 周三　–　2021-05-23 周四</p>
        <hr />
        <div class="requirement">带团结束，由 1 个领队选择以下发布内容方式任何 1 种</div>
        <div class="publish-options">
          <button><i>01</i><strong>发布1篇游记，1个团1篇</strong><small>官网或游侠客APP</small><em>›</em></button>
          <b>或</b>
          <button><i>02</i><strong>发布遇见，每日发布</strong><small>游侠客APP</small><em>›</em></button>
        </div>
      </section>

      <section class="team-progress">
        <p><b>cici/陈成</b>　提交了 <strong>3</strong> 篇遇见</p>
        <p><b>白开水/陈蛋蛋</b>　提交了 <strong>3</strong> 篇遇见</p>
      </section>

      <nav class="content-tabs" role="tablist">
        <button class="active" role="tab" aria-selected="true">遇见</button>
        <button role="tab" aria-selected="false" data-toast="切换到游记列表">游记</button>
      </nav>

      <section id="contentList" class="content-list"></section>

      <footer class="submit-footer">
        <button id="submitSelected">提交</button>
        <small>遇见10-10前/游记10-22前提交</small>
      </footer>
    </main>

    <div id="sheetScrim" class="scrim" hidden></div>
    <section id="linkSheet" class="link-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
      <header><h2 id="sheetTitle">添加外部链接</h2><button id="closeSheet" aria-label="关闭">×</button></header>
      <p>支持抖音或小红书，每篇游记最多添加 1 个</p>
      <label for="shareInput">分享内容或链接</label>
      <div class="share-input-wrap">
        <textarea id="shareInput" rows="4" placeholder="可粘贴整段分享文案，系统会自动提取其中的链接"></textarea>
        <button id="pasteShare" type="button">粘贴</button>
      </div>
      <small id="parseHint">支持自动识别分享文案中的链接</small>
      <button id="saveLink" class="save-link">保存</button>
    </section>

    <section id="invalidDialog" class="invalid-dialog" role="alertdialog" aria-modal="true" hidden>
      <h2>链接无法识别</h2>
      <p>请粘贴抖音或小红书分享内容中的完整链接，目前仅支持这两个平台。</p>
      <button id="openTutorial">查看获取链接教程</button>
      <button id="closeInvalid">重新填写</button>
    </section>

    <div id="submitToast" class="toast" role="status" aria-live="polite"></div>
    <script src="./submit-content.js"></script>
  </body>
</html>
