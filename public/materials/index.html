<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="领队素材库：热门灵感和线路素材，拿来就能发。" />
    <title>领队素材库 · 游侠领队</title>
    <link rel="stylesheet" href="./styles.css?v=11" />
    <link rel="stylesheet" href="./route-list.css?v=11" />
    <link rel="stylesheet" href="./generic-gallery.css?v=12" />
    <link rel="stylesheet" href="./detail-meta.css" />
    <link rel="stylesheet" href="./unified-ui.css?v=13" />
  </head>
  <body>
    <main class="app-shell" id="app">
      <section id="homePage" class="page page-active">
        <header class="topbar">
          <button class="icon-btn" id="backToLeaderHome" aria-label="返回我的页面"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
          <div class="topbar-title">领队素材库</div>
          <button class="mini-capsule" id="helpButton" aria-label="使用说明"><svg viewBox="0 0 82 32" aria-hidden="true"><circle cx="17" cy="16" r="2.4" fill="currentColor"/><circle cx="25" cy="16" r="2.4" fill="currentColor"/><circle cx="33" cy="16" r="2.4" fill="currentColor"/><path d="M46 6v20"/><circle cx="65" cy="16" r="9"/><circle cx="65" cy="16" r="4" fill="currentColor" stroke="none"/></svg></button>
        </header>

        <section class="section hot-materials">
          <div class="section-head">
            <div><h2>当下热门</h2></div>
          </div>
          <div class="generic-tabs" role="tablist" aria-label="热门素材分类">
            <button class="generic-tab active" data-generic-tab="photos" role="tab">素材图片</button>
            <button class="generic-tab" data-generic-tab="videos" role="tab">素材视频</button>
          </div>
          <div class="gallery-toolbar"><button class="text-btn" id="selectToggle" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M7 5V3.5h10V5M6.5 16l3.5-3.5 2.5 2.5 2-2 3 3"/></svg>批量选择</button></div>
          <div id="genericGrid" class="asset-grid hot-asset-grid"></div>
          <button id="toggleHotMaterials" class="hot-materials-more" type="button" aria-controls="genericGrid" aria-expanded="false" hidden>查看全部</button>
        </section>

        <section class="section routes-section">
          <div class="section-head route-head">
            <div class="route-title-group"><h2>热门线路</h2></div>
          </div>
          <div class="route-tabs" role="tablist" aria-label="线路分类">
            <button class="route-tab active" data-category="nearby" role="tab">周边游</button>
            <button class="route-tab" data-category="domestic" role="tab">国内游</button>
            <button class="route-tab" data-category="outbound" role="tab">出境游</button>
          </div>
          <div class="route-control-row">
            <button class="search-entry" id="openSearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>搜线路</button>
            <div id="cityFilters" class="city-filter-row">
              <label class="city-select-wrap">
                <select id="citySelect" aria-label="选择周边游出发城市"></select>
              </label>
            </div>
          </div>
          <div id="routeList" class="route-list"></div>
        </section>
      </section>

      <section id="libraryPage" class="page" hidden>
        <header class="library-cover">
          <button class="icon-btn cover-back" data-back aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
          <div id="libraryCoverImage" class="cover-image"></div><div class="cover-shade"></div>
          <div class="cover-copy"><span id="libraryBadge" class="cover-badge">周边游 TOP 1</span><h1 id="libraryTitle">川西秘境 4 日</h1></div>
        </header>
        <div class="library-body">
          <div class="library-tabs" role="tablist">
            <button class="library-tab active" data-library-tab="photos">素材图片 <span id="photoCount"></span></button>
            <button class="library-tab" data-library-tab="videos">素材视频 <span id="videoCount"></span></button>
          </div>
          <div id="librarySelectionToolbar" class="gallery-toolbar" hidden><button class="text-btn" id="librarySelectToggle" type="button" aria-pressed="false">批量选择</button></div>
          <div id="libraryContent" class="library-content"></div>
        </div>
      </section>

      <section id="searchPage" class="page" hidden>
        <header class="search-header">
          <button class="icon-btn" data-back aria-label="返回"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
          <label class="search-box"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg><input id="searchInput" type="search" placeholder="搜索线路名称或目的地" autocomplete="off" /></label>
        </header>
        <div class="search-body">
          <div id="searchIntro"><div class="chips"><button data-keyword="新疆">新疆</button><button data-keyword="徒步">徒步</button><button data-keyword="云南">云南</button><button data-keyword="日本">日本</button></div></div>
          <div id="searchResults" class="route-list search-results"></div>
        </div>
      </section>

      <div id="selectionBar" class="selection-bar" hidden><button id="cancelSelection">取消</button><div><strong id="selectedCount">0</strong><span>已选素材</span></div><button id="saveSelected" class="save-button" disabled>保存到相册</button></div>
    </main>

    <div id="scrim" class="scrim" hidden></div>
    <section id="previewSheet" class="bottom-sheet preview-sheet" role="dialog" aria-modal="true" aria-label="素材预览" hidden>
      <header class="preview-topbar">
        <button class="sheet-close" data-close aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div id="previewCounter" class="preview-counter" hidden></div>
        <button class="preview-more" type="button" aria-label="更多操作">•••</button>
      </header>
      <button id="previewPrev" class="preview-nav preview-prev" aria-label="上一个素材" hidden>‹</button>
      <button id="previewNext" class="preview-nav preview-next" aria-label="下一个素材" hidden>›</button>
      <div id="previewMedia" class="preview-media"></div>
      <div class="preview-copy">
        <div class="preview-details">
          <div class="preview-author">
            <span class="preview-avatar" aria-hidden="true"></span>
            <span class="preview-author-copy"><strong id="previewAuthor">易涟（领队）</strong><span id="previewShotAt">拍摄于 2026-10-02 12:04</span></span>
          </div>
          <div class="preview-stats">
            <span class="preview-stat-with-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
              <span id="previewViews">浏览 238</span>
            </span>
            <span class="preview-stat-with-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13m-7-7 7 7 7-7M4 21h16"/></svg>
              <span id="previewDownloadCount"></span>
            </span>
            <span id="previewSize">4.2MB</span>
          </div>
        </div>
        <button id="saveSingle" class="primary-btn">保存到相册</button>
      </div>
    </section>

    <section id="packageSheet" class="bottom-sheet package-sheet" role="dialog" aria-modal="true" hidden>
      <button class="sheet-close" data-close aria-label="关闭">×</button><div id="packageMedia" class="package-media"></div>
      <div class="package-body"><div class="package-badges"><span>直接发布</span><span id="packageMediaMeta">6 张图片</span></div><h2 id="packageTitle">川西的秋天，真的不用滤镜</h2><label for="captionInput">推荐文案</label><textarea id="captionInput" maxlength="50" rows="3"></textarea><div class="caption-count"><span id="captionCount">0</span>/50</div><button id="saveAndCopy" class="primary-btn">保存素材并复制文案</button></div>
    </section>

    <section id="platformSheet" class="bottom-sheet platform-sheet" role="dialog" aria-modal="true" hidden>
      <div class="success-mark">✓</div><h2>素材已保存，文案已复制</h2>
      <div class="platform-actions"><button data-platform="抖音"><span class="douyin-icon">♪</span><strong>去抖音</strong></button><button data-platform="小红书"><span class="xhs-icon">小红书</span><strong>去小红书</strong></button></div><button class="later-btn" data-close>稍后再发</button>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js?v=27"></script>
  </body>
</html>
